
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wordgame
      POSTGRES_USER: wordgame
      POSTGRES_PASSWORD: wordgame_dev_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wordgame -d wordgame"]
      interval: 5s
      timeout: 3s
      retries: 10

  cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: wordgame
      PGUSER: wordgame
      PGPASSWORD: wordgame_dev_only
    volumes:
      - ./migrations:/migrations:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for f in /migrations/*.sql; do
          echo "Applying migration: $$f"
          psql -v ON_ERROR_STOP=1 -f "$$f"
        done

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: word-game:local
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://wordgame:wordgame_dev_only@db:5432/wordgame?sslmode=disable
      REDIS_URL: redis://cache:6379/0
      PORT: "8080"
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
